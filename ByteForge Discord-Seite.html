<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ByteForge | Game Development auf Discord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14; --ink:#f2f6ff; --muted:#8294b4; --cyan:#4df3ff; --blue:#2f6bff;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Sora","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow-x:hidden;
}
#embers{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{
  position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:32px 24px;max-width:560px;width:100%;
}
.logo-wrap{perspective:900px;margin-bottom:36px}
.logo{
  width:min(72vw,340px);aspect-ratio:1;border-radius:50%;display:block;
  box-shadow:0 0 0 1px #1d2c48,0 0 60px rgba(77,243,255,.18),0 0 140px rgba(47,107,255,.22);
  transform-style:preserve-3d;transition:transform .15s ease-out;
  animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both,breathe 4.5s ease-in-out 1.1s infinite;
}
@keyframes rise{from{opacity:0;transform:scale(.82) translateY(24px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes breathe{
  0%,100%{box-shadow:0 0 0 1px #1d2c48,0 0 50px rgba(77,243,255,.14),0 0 120px rgba(47,107,255,.18)}
  50%{box-shadow:0 0 0 1px #2a4470,0 0 80px rgba(77,243,255,.34),0 0 180px rgba(47,107,255,.34)}
}
h1{font-weight:600;font-size:clamp(1.5rem,5.5vw,2rem);line-height:1.2;margin:0 0 12px;letter-spacing:-.01em}
p{margin:0 0 32px;color:var(--muted);font-size:1.02rem;line-height:1.6;max-width:36ch}
h1,p,.join{animation:fade .8s ease-out both}
h1{animation-delay:.7s} p{animation-delay:.85s} .join{animation-delay:1s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.join{
  position:relative;display:inline-flex;align-items:center;gap:12px;overflow:hidden;
  padding:16px 30px;border-radius:12px;text-decoration:none;color:#04101c;font-weight:600;font-size:1.05rem;
  background:linear-gradient(135deg,var(--cyan),var(--blue));
  box-shadow:0 8px 30px rgba(47,107,255,.35);
  transition:transform .2s,box-shadow .2s;
}
.join svg{width:22px;height:22px;fill:currentColor}
.join::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-20deg);transition:left .6s ease;
}
.join:hover,.join:focus-visible{transform:translateY(-3px);box-shadow:0 14px 40px rgba(77,243,255,.4)}
.join:hover::after,.join:focus-visible::after{left:130%}
.join:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

      var f=Math.max(0,Math.min(1,p.y/H));
      g.fillStyle='rgba('+p.hue+','+(p.a*f)+')';
      g.fillRect(p.x,p.y,p.s,p.s);
      if(p.y<-10)P[i]=mk(false);
    }
    if(!reduce)requestAnimationFrame(tick);
  }
  tick();
})();
</script>
